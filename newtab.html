<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Frostpane</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="styles.css" />
</head>
<body data-layout="stack">
  <div class="glow" id="glow"></div>

  <main class="panel">
    <div class="homescreen-card" id="homescreen-card">
      <div class="hs-header" id="hs-header">
        <div class="greeting" id="greeting">Good morning</div>
        <div class="clock" id="clock">00:00</div>
        <div class="hs-divider" id="hs-divider"></div>
        <div class="date" id="date">Loading&hellip;</div>
      </div>

      <form class="searchbar" id="search-form" autocomplete="off">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.42)" stroke-width="1.6" stroke-linecap="round">
          <circle cx="11" cy="11" r="7"></circle>
          <path d="M16.5 16.5 21 21"></path>
        </svg>
        <input type="text" id="search-input" placeholder="Search or enter address" autofocus />
      </form>

      <div class="tile-grid" id="tile-grid"></div>
    </div>

    <div class="settings-widget" id="settings-widget">
      <button class="settings-toggle" id="settings-toggle" type="button" aria-label="Settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
      <div class="settings-panel" id="settings-panel" hidden>
        <div class="settings-section">
          <div class="settings-label">Accent colour</div>
          <div class="swatch-row" id="swatch-row"></div>
          <div class="swatch-custom">
            <span>Custom</span>
            <span class="swatch-custom-slot" id="swatch-custom-slot"></span>
          </div>
        </div>
        <div class="settings-section">
          <div class="settings-label">Layout</div>
          <div class="layout-row" id="layout-row"></div>
        </div>
        <div class="settings-section">
          <div class="settings-row">
            <span class="settings-row-label">24-hour clock</span>
            <label class="switch">
              <input type="checkbox" id="clock-format-toggle" checked />
              <span class="switch-track"></span>
            </label>
          </div>
        </div>
        <div class="settings-section">
          <div class="settings-label">Bookmarks</div>
          <div class="settings-actions">
            <button class="tool-btn" id="export-btn" type="button">Export</button>
            <button class="tool-btn" id="import-btn" type="button">Import</button>
            <input type="file" id="import-file" accept="application/json" hidden />
          </div>
        </div>
      </div>
    </div>
  </main>

  <div class="modal-backdrop" id="tile-modal-backdrop" hidden>
    <div class="modal" id="tile-modal">
      <div class="modal-title" id="modal-title">Add bookmark</div>
      <label class="field">
        <span>Name</span>
        <input type="text" id="tile-name" maxlength="24" placeholder="e.g. YouTube" />
      </label>
      <label class="field">
        <span>URL</span>
        <input type="text" id="tile-url" placeholder="https://example.com" />
      </label>
      <label class="field">
        <span>Icon letter (optional)</span>
        <input type="text" id="tile-icon" maxlength="2" placeholder="Auto from name" />
      </label>
      <div class="modal-actions">
        <button type="button" class="modal-btn danger" id="tile-remove" hidden>Remove</button>
        <div class="modal-actions-right">
          <button type="button" class="modal-btn ghost" id="tile-cancel">Cancel</button>
          <button type="button" class="modal-btn primary" id="tile-save">Save</button>
        </div>
      </div>
    </div>
  </div>

  <div class="tile-tooltip" id="tile-tooltip" role="tooltip"></div>

  <input type="color" id="swatch-custom-input" value="#606edc" aria-label="Custom accent colour" />

  <script src="script.js"></script>
</body>
</html>
